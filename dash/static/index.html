<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* set the theme before first paint: ?theme= > saved choice > OS setting */
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('dash.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="topbar-right">
      <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch theme" title="Switch theme">
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" class="attention-btn" id="attention-btn" aria-haspopup="dialog">
        Needs attention <span class="pill-count" id="attention-count">–</span>
      </button>
      <div class="clock">
        <div class="clock-time" id="clock">–</div>
        <div class="clock-sub"><span class="dot" id="updated-dot"></span><span id="updated">Connecting…</span></div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div>
      <h1 id="title">HomeLab</h1>
      <div class="hero-date" id="date">–</div>
    </div>
    <div class="kpis">
      <div class="kpi kpi-green"><div class="kpi-num" id="kpi-online">–</div><div class="kpi-label">Services online</div></div>
      <div class="kpi kpi-amber"><div class="kpi-num" id="kpi-attention">–</div><div class="kpi-label">Needs attention</div></div>
      <div class="kpi kpi-red"><div class="kpi-num" id="kpi-offline">–</div><div class="kpi-label">Offline</div></div>
    </div>
  </section>

  <section class="row">
    <article class="card truenas" id="truenas"></article>

    <article class="card unifi">
      <div class="card-head">
        <a class="tile-title" id="unifi-link" target="_blank" rel="noopener">
          <span class="logo logo-fill"><img src="icons/unifi.svg" alt=""></span>
          <div><h2>UniFi</h2><div class="sub" id="unifi-sub">UniFi Dream Machine Pro</div></div>
        </a>
        <div class="controls">
          <div class="seg" role="group" aria-label="Chart type">
            <button type="button" data-chart="line" aria-label="Line chart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8 3 3"/></svg></button>
            <button type="button" data-chart="bars" aria-label="Bar chart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 20V11M12 20V5M18 20v-6"/></svg></button>
          </div>
          <span class="legend"><span class="swatch down"></span>Download</span>
          <span class="legend"><span class="swatch up"></span>Upload</span>
          <div class="seg" role="group" aria-label="Time range">
            <button type="button" data-range="24">24 hours</button>
            <button type="button" data-range="168">7 days</button>
          </div>
        </div>
      </div>
      <div class="strip" id="unifi-strip"></div>
      <div class="unifi-body">
        <div class="chart-wrap">
          <div class="chart-caption" id="chart-caption">Mbps, hourly averages</div>
          <div class="chart" id="chart"></div>
          <div class="chart-x" id="chart-x"></div>
        </div>
        <div class="top-clients">
          <div class="tc-head"><a id="unifi-clients-link" target="_blank" rel="noopener"><h3>Top clients</h3></a><span>Last 24 hours</span></div>
          <ol id="top-clients"></ol>
        </div>
      </div>
    </article>
  </section>

  <div id="tiles"></div>

  <section class="card apps" id="apps"></section>

</div>

<dialog id="attention-dialog" aria-labelledby="attention-title">
  <div class="dlg-head">
    <h2 id="attention-title">Needs attention</h2>
    <button type="button" class="dlg-close" id="attention-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <ul id="attention-list"></ul>
</dialog>

<script src="app.js"></script>
</body>
</html>
